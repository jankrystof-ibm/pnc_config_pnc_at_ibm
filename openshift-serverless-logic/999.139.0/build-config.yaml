product:
  name: {{productName}}
  abbreviation: osl
  stage: {{stage}}
  issueTrackerUrl: http://issues.jboss.org/browse/KOGITO
version: {{productVersion}}
milestone: {{milestone}}
group: {{productName}}-{{productVersion}}-{{milestone}}-all

defaultBuildParameters:
  project: osl
  environmentId: 1664 # "OpenJDK 17.0; RHEL 9; Mvn 3.9.11"
  buildScript: {{baseMavenTree}}
builds:
  - name: org.kie.kogito-kogito-runtimes-{{kogitoVersion}}
    project: kiegroup/kogito-runtimes
    scmUrl: https://{{gitServer}}/kiegroup/kogito-runtimes.git
    scmRevision:  {{scmRevisionKogito}}
    alignmentParameters:
      - '{{versionOverrideKogito}}'
      - '-DdroolsVersion={{droolsVersion}}'
      - '-DkogitoVersion={{kogitoCommunityVersion}}'
      - '-DquarkusVersion={{quarkusVersion}}'
      - '-DquarkusVersionCommunity={{quarkusVersionCommunity}}'
      - '-DimageRegistry={{dataIndexImageRegistry}}'
      - '-DdependencyOverride.com.google.protobuf:*@*='
      - '-DdependencyOverride.io.grpc:*@*='
      - '-DdependencyOverride.io.quarkus:quarkus-bom@*={{quarkusVersion}}'
      - '-DdependencyOverride.io.quarkus:quarkus-test-maven@*={{quarkusVersionCommunity}}'
      - '-DgroovyScripts={{groovyScriptBase}}/FixProtobufPluginConfig.groovy,{{groovyScriptBase}}/SetDroolsVersion.groovy,{{groovyScriptBase}}/SetQuarkusVersion.groovy,{{groovyScriptBase}}/SetQuarkusTestVersionCommunity.groovy,{{groovyScriptBase}}/SetQuarkusPluginVersionCommunity.groovy,{{groovyScriptBase}}/ProcessKogitoBOM.groovy,{{groovyScriptBase}}/ProcessKogitoBOMRefs.groovy,{{groovyScriptBase}}/KogitoBOMExceptionAlignment.groovy,{{groovyScriptBase}}/SetImageRegistry.groovy'
      - '{{pmeAddMetas}}'
      - '{{pmeAddProjectSources}}'

  - name: org.kie.kogito-kogito-apps-{{kogitoVersion}}
    project: kiegroup/kogito-apps
    scmUrl: https://{{gitServer}}/kiegroup/kogito-apps.git
    scmRevision:  {{scmRevisionKogito}}
    buildScript: {{baseMavenTree}} -Dquarkus.build.image=false
    buildPodMemory: 16
    alignmentParameters:
      - '{{versionOverrideKogito}}'
      - '-DdroolsVersion={{droolsVersion}}'
      - '-DquarkusVersionCommunity={{quarkusVersionCommunity}}'
      - '-DdependencyOverride.com.graphql-java:*@*='
      - '-DgroovyScripts={{groovyScriptBase}}/SetDroolsVersion.groovy,{{groovyScriptBase}}/OverrideKogitoRuntimesVersion.groovy,{{groovyScriptBase}}/OverrideKogitoRuntimesVersionLast.groovy,{{groovyScriptBase}}/SetQuarkusPluginVersionCommunity.groovy'
      - '{{pmeAddMetas}}'
      - '{{pmeAddProjectSources}}'
    dependencies:
      - org.kie.kogito-kogito-runtimes-{{kogitoVersion}}

  - name: org.kie.kogito-kogito-examples-{{kogitoVersion}}
    project: kiegroup/kogito-examples
    scmUrl: https://{{gitServer}}/kiegroup/kogito-examples.git
    scmRevision:  {{scmRevisionKogito}}
    buildPodMemory: 16
    alignmentParameters:
      - '{{versionOverrideKogito}}'
      - '-DdroolsVersion={{droolsVersion}}'
      - '-DquarkusPlatformVersion={{quarkusPlatformVersion}}'
      - '-DquarkusVersion={{quarkusVersion}}'
      - '-DkogitoVersion={{kogitoVersion}}'
      - '-DdependencyOverride.com.google.protobuf:*@*='
      - '-DdependencyOverride.io.grpc:*@*='
      - '-DdependencyRelocations.io.quarkus:quarkus-bom@com.redhat.quarkus.platform:quarkus-bom={{quarkusPlatformVersion}}'
      - '-DpluginRelocations.io.quarkus:quarkus-maven-plugin@com.redhat.quarkus.platform:quarkus-maven-plugin={{quarkusPlatformVersion}}'
      - '-DgroovyScripts={{groovyScriptBase}}/SetQuarkusPlatformVersion.groovy,{{groovyScriptBase}}/SetQuarkusPluginVersionQuarkus.groovy,{{groovyScriptBase}}/SetDroolsVersion.groovy,{{groovyScriptBase}}/OverrideKogitoRuntimesVersion.groovy,{{groovyScriptBase}}/OverrideKogitoRuntimesVersionLast.groovy,{{groovyScriptBase}}/SetKogitoVersionToRuntimesVersion.groovy,{{groovyScriptBase}}/InjectDroolsDep.groovy,{{groovyScriptBase}}/RemoveDroolsDep.groovy,{{groovyScriptBase}}/SetKogitoBomVersion.groovy,{{groovyScriptBase}}/OverrideKogitoVersionPropertyLast.groovy'
      - '{{pmeAddMetas}}'
      - '{{pmeAddProjectSources}}'
    dependencies:
      - org.kie.kogito-kogito-apps-{{kogitoVersion}}

  - name: org.kie.kogito-kie-tools-{{kogitoVersion}}
    project: kubesmarts/kie-tools
    scmUrl: https://{{gitServer}}/kubesmarts/kie-tools.git
    scmRevision:  {{scmRevisionKogito}}
    environmentId: 1664 # "OpenJDK 17.0; RHEL 9; Mvn 3.9.11; Go 1.24; GCC; Make"
    buildScript: {{baseCypress}}; {{baseNPMTree}}
    buildPodMemory: 24
    alignmentParameters:
      - '{{versionOverrideKogito}}'
      - '-DquarkusVersionCommunity={{quarkusVersionCommunity}}'
      - '-DquarkusVersion={{quarkusVersion}}'
      - '-DquarkusPlatformVersion={{quarkusPlatformVersion}}'
      - '-DkogitoVersion={{kogitoVersion}}'
      - '-DdroolsVersion={{droolsVersion}}'
      - '-DdependencyRelocations.io.quarkus:quarkus-bom@com.redhat.quarkus.platform:quarkus-bom={{quarkusPlatformVersion}}'
      - '-DgroovyScripts={{groovyScriptBase}}/OverrideKogitoRuntimesVersion.groovy,{{groovyScriptBase}}/OverrideKogitoVersionPropertyLast.groovy,{{groovyScriptBase}}/InlineBOMKieTools.groovy,{{groovyScriptBase}}/SetQuarkusVersion.groovy,{{groovyScriptBase}}/SetPropertiesVersionsKieTools.groovy'
      - '{{pmeAddMetas}}'
      - '{{pmeAddProjectSources}}'
    dependencies:
      - org.kie.kogito-kogito-examples-{{kogitoVersion}}

  - name: com.redhat.osl-osl-images-{{kogitoVersion}}
    project: kubesmarts/osl-images
    scmUrl: https://{{gitServer}}/kubesmarts/osl-images.git
    scmRevision:  {{scmRevisionKogito}}
    buildScript: "mvn deploy -f apps-maven-builder/pom.xml"
    alignmentParameters:
      - '--file=apps-maven-builder/pom.xml'
      - '{{versionOverrideKogito}}'
      - '-DquarkusPlatformGroupId=com.redhat.quarkus.platform'
      - '-DquarkusPlatformVersion={{quarkusPlatformVersion}}'
      - '-DquarkusVersion={{quarkusVersion}}'
      - '-Dbrotli4jVersion={{quarkusBrotli4jVersion}}'
      - '-DgroovyScripts={{groovyScriptBase}}/OverrideKogitoRuntimesVersion.groovy,{{groovyScriptBase}}/SetPropertiesVersionsOSLImages.groovy'
    dependencies:
      - org.kie.kogito-kie-tools-{{kogitoVersion}}

outputPrefixes:
  releaseFile: openshift-serverless-logic
  releaseDir: openshift-serverless-logic

flow:
  # PNC@IBM: all generations are kept on IGNORE on purpose.
  # This is the best-effort container-image track (SRVLOGIC-1050): the images consume
  # individual per-build -image-build.zip artifacts, not any generation output, so no
  # generation is required here.
  #  - licensesGeneration: IGNORE - license server is not deployed on PNC@IBM yet (per support).
  #  - repositoryGeneration: IGNORE - not needed for container images; it produces the product
  #    offline maven repo deliverable (MRRC content), which the container build does not consume.
  #    NOTE: repo generation DOES work on PNC@IBM with the bacon snapshot (per Jozef Mrazek,
  #    2026-09-10); it is skipped by choice, not because it is unavailable.
  #  - sourcesGeneration: IGNORE - not needed for container images (also works on PNC@IBM).
  #  - javadocGeneration: IGNORE - not needed.
  # Full productization (repositoryGeneration=BUILD_GROUP with excludes +
  # externalAdditionalConfigs org.drools-drools-{{droolsVersion}}, sourcesGeneration=
  # GENERATE_ADDITIONAL_SELECTED, licensesGeneration once the license server is available)
  # is deferred to SRVLOGIC-1194 (Finalize PNC@IBM onboarding).
  licensesGeneration:
    strategy: IGNORE

  repositoryGeneration:
    strategy: IGNORE

  javadocGeneration:
    strategy: IGNORE

  sourcesGeneration:
    strategy: IGNORE

# addons.extraDeliverablesDownloader disabled -- depends on repositoryGeneration/deliverables (deferred to SRVLOGIC-1194).
